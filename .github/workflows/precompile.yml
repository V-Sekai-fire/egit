# SPDX-License-Identifier: Apache-2.0
#
# Builds the NIF once per platform on a tag and attaches the archives to the
# release, so that nothing downstream compiles C++ to read a HEAD. A desk or a
# CI job then downloads the archive matching its NIF version and target triple.
#
# After the release exists, the checksums are written and committed:
#
#   MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable
#
# checksum.exs is what a consumer verifies the download against, so a package
# without it does not work. It is committed rather than generated on the fly.

name: precompile

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialised per tag rather than cancelled: a half-uploaded release is
# worse than a slow one, so a run already attaching artefacts finishes.
concurrency:
  group: precompile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precompile:
    strategy:
      fail-fast: false
      matrix:
        # OTP decides the NIF version, and a consumer downloads by it: OTP 26,
        # 27 and 28 are NIF 2.16, 2.17 and 2.18. Publishing one of them means
        # every other desk compiles, which is what this flow exists to avoid.
        # The axis is the NIF version, which is what a consumer downloads by,
        # and several OTP releases share one: 26, 27 and 28 are all NIF 2.17,
        # and 29 is 2.18. Adding OTP releases that repeat a NIF version builds
        # the same artefact name twice and covers nothing new.
        otp: ['27', '29']
        os:
          - ubuntu-latest
          - macos-15-intel  # x86_64; macos-13 is retired and queues forever
          - macos-latest    # arm64
          - windows-latest
        # Elixir is paired with OTP, not pinned across it.
        include:
          - otp: '27'
            elixir: '1.17'
          - otp: '29'
            elixir: '1.18'
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.81.0

      - name: llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=20260505
          curl -fsSL -o mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$V/llvm-mingw-$V-ucrt-x86_64.zip"
          7z x -y mingw.zip > /dev/null
          echo "$PWD/llvm-mingw-$V-ucrt-x86_64/bin" >> "$GITHUB_PATH"

      - name: precompile
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CC=clang CXX=clang++
          fi
          # No CMAKE_PREFIX_PATH. It existed to find the packaged libgit2, and
          # libgit2 is vendored now; leaving it pointed at the pixi environment
          # made libgit2's own configure link that environment's libiconv and
          # libc++ as @rpath entries with no rpath to resolve them, so the NIF
          # built and then would not load. pixi supplies cmake and ninja here,
          # not libraries.
          export ELIXIR_MAKE_CACHE_DIR="$PWD/cache"
          mkdir -p "$ELIXIR_MAKE_CACHE_DIR"
          mix deps.get
          pixi run mix elixir_make.precompile

      # An archive that unpacks to a NIF the emulator cannot load is still an
      # archive, and the release would carry it. So it is unpacked and loaded
      # before it is uploaded.
      # A build that succeeds says the compiler ran. It does not say the
      # emulator can load what came out, and the two have already come apart
      # here: the first Windows build produced a git.dll that linked cleanly
      # and then failed to load, because libc++ and libunwind were not beside
      # it. Uploading on a green build would have published that. So the
      # artefact is loaded before it is uploaded.
      #
      # Only the native archive can be loaded. macOS builds both darwin
      # targets and a cross-built artefact does not load on the host that
      # produced it, so the rest are unpacked and checked for the library
      # instead, and the run prints what it unpacked beside what it loaded.
      # A skip that prints nothing reads exactly like a pass.
      - name: load what was archived
        shell: bash
        run: |
          mkdir -p ebin
          erlc -o ebin src/*.erl
          cat > load_test.erl <<'ERL'
          -module(load_test).
          -export([main/0]).
          main() ->
            R = git:open("."),
            [_|_] = git:list_remotes(R),
            {ok, <<_:40/binary>>} = git:rev_parse(R, <<"HEAD">>),
            % a tag checkout is detached, a branch checkout is not; both answer
            case git:head(R) of {branch, _} -> ok; {detached, _} -> ok end,
            io:format("loaded~n"),
            halt(0).
          ERL
          erlc -o ebin load_test.erl

          case "$(uname -m)" in
            arm64|aarch64) host=aarch64 ;;
            *)             host=x86_64 ;;
          esac
          loaded=0; unpacked=0
          for a in cache/*.tar.gz; do
            rm -rf priv && mkdir -p priv
            tar -xzf "$a" -C priv
            ls priv/git.* >/dev/null || { echo "FAIL $a carries no git library"; exit 1; }
            unpacked=$((unpacked+1))
            case "$a" in
              *"$host"*)
                echo "== $a"
                pixi run bash -c 'erl -noshell -pa ebin -s load_test main'
                loaded=$((loaded+1)) ;;
              *)
                echo "-- $a unpacked, NOT loaded: cross-built for another architecture" ;;
            esac
          done
          echo "$unpacked archive(s) unpacked, $loaded loaded."
          [ "$loaded" -ge 1 ] || { echo "FAIL: nothing was loaded"; exit 1; }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: cache/*.tar.gz

  # Does a consumer get the artefact, or quietly build one? A runner has cmake
  # and a compiler on it, so the absence of a toolchain cannot be asserted here
  # -- the first version of this job tried, and refused to run rather than
  # pretend. What can be asserted is which path elixir_make took: it prints
  # "Downloading precompiled NIF" when it fetches, and runs the build when it
  # does not.
  consume:
    needs: precompile
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '29']
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        include:
          - otp: '27'
            elixir: '1.17'
          - otp: '29'
            elixir: '1.18'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: install from the release and call into it
        shell: bash
        run: |
          mkdir -p consume && cd consume
          git init -q .
          git -c user.email=t@t -c user.name=t commit -q --allow-empty -m probe
          cat > use.exs <<'EX'
          Mix.install([{:egit, git: "https://github.com/V-Sekai-fire/egit.git",
                        tag: System.get_env("TAG")}])
          r = :git.open(".")
          case :git.head(r) do
            {:branch, _} -> :ok
            {:branch, _, :unborn} -> :ok
            {:detached, _} -> :ok
            other -> raise "head/1 gave #{inspect(other)}"
          end
          IO.puts("the NIF answers")
          EX
          TAG="${GITHUB_REF_NAME}" elixir use.exs 2>&1 | tee out.txt
          grep -q "the NIF answers" out.txt || { echo "FAIL: the NIF did not answer"; exit 1; }
          grep -q "Downloading precompiled NIF" out.txt             || { echo "FAIL: no artefact was downloaded; it built one instead"; exit 1; }
          echo "ok: downloaded the artefact and called into it"

  # The control. consume passes when it sees "Downloading precompiled NIF", and
  # that is only evidence if the same install without a download does not print
  # it. So the build is forced here and the marker is required to be ABSENT.
  consume-control:
    needs: precompile
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'

      - name: a forced build must not look like a download
        shell: bash
        run: |
          mkdir -p control && cd control
          cat > forced.exs <<'EX'
          Application.put_env(:elixir_make, :force_build, egit: true)
          Mix.install([{:egit, git: "https://github.com/V-Sekai-fire/egit.git",
                        tag: System.get_env("TAG")}])
          IO.puts("forced build finished")
          EX
          TAG="${GITHUB_REF_NAME}" elixir forced.exs 2>&1 | tee out.txt || true
          if grep -q "Downloading precompiled NIF" out.txt; then
            echo "CONTROL DID NOT FIRE: a forced build printed the download marker,"
            echo "so consume cannot tell a download from a build."
            exit 1
          fi
          echo "ok: a forced build does not print it, so the marker means a download"
