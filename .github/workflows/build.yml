# SPDX-License-Identifier: Apache-2.0
#
# Proves the NIF builds on all three platforms and loads into the emulator.
# Building is not the check: the Makefile this replaces compiled on Linux for
# years while the Windows build had four separate faults, and a compile says
# nothing about whether the emulator can load what came out. So each job opens
# a repository through libgit2 and reads something back.

name: build

# A branch with an open pull request would otherwise run this twice for the
# same commit, once per event, and report every job as a duplicate check.
on:
  push:
    branches: [main]
  pull_request:

# A push to a branch with a pull request open supersedes the run already
# going for it, and the older one is then reporting on a commit nobody is
# looking at while holding a runner.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.81.0

      - name: llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # --fail, because curl without it writes the 404 body to the file and
          # exits 0: the download "succeeded" and 7z then reported the zip as
          # corrupt, which reads as a bad archive rather than a wrong URL.
          V=20260505
          curl -fsSL -o mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$V/llvm-mingw-$V-ucrt-x86_64.zip"
          7z x -y mingw.zip > /dev/null
          echo "$PWD/llvm-mingw-$V-ucrt-x86_64/bin" >> "$GITHUB_PATH"

      - name: configure and build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CC=clang CXX=clang++
          fi
          # No CMAKE_PREFIX_PATH. It existed to find the packaged libgit2, and
          # libgit2 is vendored now; leaving it pointed at the pixi environment
          # made libgit2's own configure link that environment's libiconv and
          # libc++ as @rpath entries with no rpath to resolve them, so the NIF
          # built and then would not load. pixi supplies cmake and ninja here,
          # not libraries.
          pixi run cmake -P build.cmake

      # The check. A build that produced an unloadable NIF passes every step
      # above it, so the artefact is loaded and asked a real question.
      - name: load the NIF and read this repository
        shell: bash
        run: |
          mkdir -p ebin
          erlc -o ebin src/*.erl
          cat > load_test.erl <<'ERL'
          -module(load_test).
          -export([main/0]).
          main() ->
            R = git:open("."),
            [_|_] = git:list_remotes(R),
            {ok, <<_:40/binary>>} = git:rev_parse(R, <<"HEAD">>),
            io:format("ok~n"),
            halt(0).
          ERL
          erlc -o ebin load_test.erl
          # load_nif's reason is what says why, and on_load swallows it: the
          # caller only sees undef on the first call, which names no symbol and
          # no library. So the reason is asked for directly when the load fails.
          if ! pixi run bash -c 'erl -noshell -pa ebin -s load_test main'; then
            echo "--- linkage"
            ls -l priv/ || true
            (otool -L priv/git.so 2>/dev/null || ldd priv/git.so 2>/dev/null) || true
            exit 1
          fi
